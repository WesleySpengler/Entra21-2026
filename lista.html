<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Lista de Clientes</title>

  <style>

    body{
      font-family: Arial, Helvetica, sans-serif;
      background:#f2f2f2;
      margin:0;
      padding:0;
    }

    .container{
      width:900px;
      margin:30px auto;
    }

    h1{
      color:#333;
      margin-bottom:20px;
    }

    .lista{
      display:grid;

      grid-template-columns:
      repeat(auto-fill, minmax(250px, 1fr));

      gap:20px;
    }

    .card-cliente{
      background:white;
      border-radius:12px;
      padding:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    .nome{
      font-size:24px;
      font-weight:bold;
      color:#007bff;
      margin-bottom:15px;
    }

    .info{
      font-size:15px;
      color:#444;
      margin-bottom:8px;
    }

    .botoes{
      margin-top:15px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      padding:10px 15px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      color:white;
      font-weight:bold;
    }

    .btn-editar{
      background:#28a745;
    }

    .btn-excluir{
      background:red;
    }

    .btn-detalhes{
      background:#6f42c1;
    }

    .btn-voltar{
      background:#007bff;
      margin-top:30px;
    }

    .form-edicao{
      margin-top:15px;
      display:none;
    }

    .form-edicao input{
      width:100%;
      padding:10px;
      margin-top:8px;
      border:1px solid #ccc;
      border-radius:5px;
      box-sizing:border-box;
    }

    .btn-salvar{
      background:#ff9800;
      margin-top:10px;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Clientes Cadastrados</h1>

    <div class="lista" id="listaClientes"></div>

    <button
      class="btn-voltar"
      onclick="voltar()">

      Voltar

    </button>

  </div>

  <script>

    let clientes =
    JSON.parse(localStorage.getItem('clientes')) || []

    const lista =
    document.getElementById('listaClientes')

    function carregarClientes(){

      lista.innerHTML = ''

      clientes.forEach((cliente, index) => {

        const card =
        document.createElement('div')

        card.classList.add('card-cliente')

        card.innerHTML = `
        
          <div class="nome">
            ${cliente.nome}
          </div>

          <div class="info">
            <strong>E-mail:</strong>
            ${cliente.email}
          </div>

          <div class="info">
            <strong>Telefone:</strong>
            ${cliente.telefone}
          </div>

          <div class="info">
            <strong>CEP:</strong>
            ${cliente.cep}
          </div>

          <div class="botoes">

            <button
              class="btn-editar"
              onclick="mostrarEdicao(${index})">

              Editar

            </button>

            <button
              class="btn-excluir"
              onclick="excluirCliente(${index})">

              Excluir

            </button>

            <button
              class="btn-detalhes"
              onclick="verDetalhes('${cliente.cep}')">

              Detalhes

            </button>

          </div>

          <div
            class="form-edicao"
            id="form${index}">

            <input
              type="text"
              id="nome${index}"
              value="${cliente.nome}">

            <input
              type="email"
              id="email${index}"
              value="${cliente.email}">

            <input
              type="text"
              id="telefone${index}"
              value="${cliente.telefone}">

            <input
              type="text"
              id="cep${index}"
              value="${cliente.cep}">

            <button
              class="btn-salvar"
              onclick="salvarEdicao(${index})">

              Salvar

            </button>

          </div>

        `

        lista.appendChild(card)

      })

    }

    function excluirCliente(index){

      clientes.splice(index, 1)

      localStorage.setItem(
        'clientes',
        JSON.stringify(clientes)
      )

      carregarClientes()

    }

    function mostrarEdicao(index){

      const formulario =
      document.getElementById(`form${index}`)

      formulario.style.display = 'block'

    }

    function salvarEdicao(index){

      clientes[index].nome =
      document.getElementById(`nome${index}`).value

      clientes[index].email =
      document.getElementById(`email${index}`).value

      clientes[index].telefone =
      document.getElementById(`telefone${index}`).value

      clientes[index].cep =
      document.getElementById(`cep${index}`).value

      localStorage.setItem(
        'clientes',
        JSON.stringify(clientes)
      )

      carregarClientes()

    }

    function verDetalhes(cep){

      window.location.href =
      `consumir-api.html?cep=${cep}`

    }

    function voltar(){

      window.location.href = 'cadastro.html'

    }

    carregarClientes()

  </script>

</body>
</html>
