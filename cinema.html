<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seleção de Assentos - Cinema</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(220,38,38,0.18), transparent 30%),
        linear-gradient(180deg, #050505 0%, #090909 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 6px;
    }

    .cinema-brand {
      position: relative;
      overflow: hidden;
      text-align:center;
      margin-bottom:35px;
    }

    .brand-top {
      font-family:'Bebas Neue', sans-serif;
      color:#f59e0b;
      font-size:2.3rem;
      letter-spacing:8px;
      margin-bottom:-8px;
      text-shadow:0 0 20px rgba(245,158,11,0.5);
    }

    .brand-main {
      position: relative;
      z-index: 2;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .emoji {
      font-size:3.5rem;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
    }

    .brand-text {
      position: relative;
      z-index: 2;
      font-family:'Bebas Neue', sans-serif;
      font-size:4.8rem;
      letter-spacing:4px;
      background:linear-gradient(180deg,#ffe082 0%, #f59e0b 45%, #dc2626 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:
        0 0 15px rgba(245,158,11,0.35),
        0 0 40px rgba(220,38,38,0.15);
      line-height:0.95;
    }

    .brand-line {
      position: relative;
      z-index: 2;
      width:100%;
      max-width:99%;
      height:2px;
      margin:18px auto 10px;
      background:linear-gradient(90deg,transparent,#dc2626,transparent);
      box-shadow:0 0 15px rgba(220,38,38,0.5);
    }

    .popcorn-left,
    .popcorn-right {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:7rem;
      opacity:0.18;
      filter:drop-shadow(0 0 20px rgba(245,158,11,0.35));
      pointer-events:none;
    }

    .popcorn-left {
      left:2%;
      transform:translateY(-50%) rotate(-12deg);
    }

    .popcorn-right {
      right:2%;
      transform:translateY(-50%) rotate(12deg);
    }

    .stars {
      position:absolute;
      color:#fcd34d;
      opacity:0.7;
      letter-spacing:8px;
      text-shadow:0 0 12px rgba(252,211,77,0.5);
      pointer-events:none;
    }

    .stars-1 {
      top:5px;
      left:50%;
      transform:translateX(-50%);
      font-size:1.4rem;
    }

    .stars-2 {
      bottom:20px;
      right:20%;
      font-size:1rem;
    }

    .main-layout {
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:20px;
      align-items:start;
    }

    .movie-panel {
      background: linear-gradient(180deg, rgba(20,20,20,0.98), rgba(10,10,10,0.98));
      border:1px solid rgba(255,255,255,0.06);
      border-radius:24px;
      padding:20px;
      position:sticky;
      top:10px;
      box-shadow:0 0 30px rgba(0,0,0,0.35);
    }

    .movie-poster {
      width:100%;
      height:480px;
      border-radius:18px;
      object-fit:cover;
      margin-bottom:18px;
      border:1px solid rgba(255,255,255,0.08);
    }

    .movie-title {
      font-size:2rem;
      font-weight:700;
      margin-bottom:8px;
    }

    .movie-info {
      color:#cbd5e1;
      line-height:1.8;
      margin-bottom:20px;
    }

    .selection-box {
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.05);
      border-radius:18px;
      padding:18px;
    }

    .selection-title {
      font-size:1.1rem;
      font-weight:700;
      margin-bottom:10px;
    }

    .container {
      width:99vw;
      position: relative;
      width: 100%;
      max-width: 98vw;
      background: linear-gradient(180deg, rgba(15,15,15,0.98), rgba(10,10,10,0.98));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(239,68,68,0.15);
      border-radius: 18px;
      padding: 18px 10px;
      box-shadow: 0 0 60px rgba(239,68,68,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.2rem;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .screen {
      border-top: 2px solid rgba(255,255,255,0.35);
      position: relative;
      width: 80%;
      height: 78px;
      margin: 0 auto 50px;
      background: linear-gradient(to bottom, #d4d4d4, #737373);
      border-radius: 12px 12px 120px 120px;
      box-shadow: 0 0 30px rgba(255,255,255,0.15);
      transform: perspective(600px) rotateX(-55deg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #e2e8f0;
      font-size: 0.95rem;
    }

    .seat-preview {
      width: 22px;
      height: 22px;
      border-radius: 8px 8px 4px 4px;
    }

    .available-preview {
      background: linear-gradient(180deg,#5b5b5b,#2d2d2d);
    }

    .selected-preview {
      background: linear-gradient(180deg,#facc15,#eab308);
    }

    .occupied-preview {
      background: linear-gradient(180deg,#dc2626,#991b1b);
    }

    .cinema-wrapper {
      width:100%;
      justify-content:center;
      display:flex;
      gap:16px;
      align-items:flex-start;
      background: rgba(255,255,255,0.03);
      padding: 30px 8px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.05);
      overflow-x:auto;
      border-radius:40px;
      background:linear-gradient(180deg,#0a0a0a,#050505);
      box-shadow: inset 0 0 40px rgba(220,38,38,0.08);
    }

    .side-labels {
      display:flex;
      flex-direction:column;
      gap:14px;
      color:#cbd5e1;
      font-weight:bold;
      margin-top:3px;
      min-width:20px;
    }

    .cinema {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row-label {
      width: 25px;
      font-weight: bold;
      color: #94a3b8;
    }

    .seats {
      display: flex;
      gap: 10px;
    }

    .seat {
      border:1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 0 10px rgba(0,0,0,0.35);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      width: 38px;
      height: 34px;
      background: #334155;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      border: 2px solid transparent;
    }

    .seat:hover:not(.occupied) {
      transform: translateY(-4px);
      background: #475569;
    }

    .seat.selected {
      color: #111;
      background: #22c55e;
      border-color: #86efac;
      box-shadow: 0 0 12px rgba(34,197,94,0.5);
    }

    .seat.occupied {
      color: white;
      background: #ef4444;
      cursor: not-allowed;
      opacity: 0.8;
    }

    .aisle {
      width: 45px;
      position: relative;
    }

    .aisle::after {
      content: 'ESCADA';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      color: rgba(255,255,255,0.25);
      font-size: 0.6rem;
      letter-spacing: 2px;
    }

    .wheelchair {
      color:white;
      background: linear-gradient(180deg,#2563eb,#1d4ed8) !important;
      border-color: #93c5fd !important;
      font-size: 1rem;
    }

    .seat-number {
      pointer-events: none;
      font-size: 0.62rem;
      font-weight: bold;
      color: white;
    }

    .stairway {
      margin: 0 6px;
      width: 32px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .stairs {
      width: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .step {
      box-shadow:0 0 8px rgba(239,68,68,0.25);
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg,rgba(239,68,68,0.15),rgba(255,255,255,0.18),rgba(239,68,68,0.15));
      border-radius: 10px;
    }

    .stair-text {
      position: absolute;
      transform: rotate(90deg);
      font-size: 0.55rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 2px;
      font-weight: bold;
    }

    .info {
      border:1px solid rgba(239,68,68,0.2);
      margin-top: 35px;
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .selected-list {
      color: #e2e8f0;
      line-height: 1.8;
    }

    .total {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .button {
      box-shadow: 0 0 20px rgba(220,38,38,0.25);
      background: linear-gradient(135deg,#dc2626,#991b1b);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.03);
    }

    @media (max-width: 768px) {
      .seat {
        width: 26px;
        height: 26px;
      }

      .seats {
        gap: 6px;
      }

      .aisle {
        width: 15px;
      }

      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="main-layout">
  <div class="container">
    <div class="cinema-brand">
      <div class="popcorn-left">🍿</div>
      <div class="popcorn-right">🍿</div>
      <div class="stars stars-1">✦ ✦ ✦</div>
      <div class="stars stars-2">✦ ✦</div>
      <div class="brand-top"></div>

      <div class="brand-main">
        
        <span class="brand-text">Cine Lumière</span>
        
      </div>

      <div class="brand-line"></div>

      <p class="subtitle">Escolha seus assentos para a próxima sessão</p>
    </div>

    <div class="screen">TELA DO CINEMA</div>

    <div class="legend">
      <div class="legend-item">
        <div class="seat-preview available-preview"></div>
        Disponível
      </div>

      <div class="legend-item">
        <div class="seat-preview selected-preview"></div>
        Selecionado
      </div>

      <div class="legend-item">
        <div class="seat-preview occupied-preview"></div>
        Ocupado
      </div>
    </div>

    <div style="display:flex; justify-content:center; align-items:flex-start;">
      <div class="cinema-wrapper">
        
        <div class="cinema" id="cinema"></div>
      </div>
    </div>

    
  </div>

  <script>
window.onload = () => {

  const cinema = document.getElementById('cinema');
  const selectedSeatsText = document.getElementById('selectedSeatsPanel');
  const totalText = document.getElementById('totalPanel');

  const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
  const seatsPerRow = 18;
  const ticketPrice = 32;

  const occupiedSeats = [
    'A3', 'A4', 'A8', 'A9',
    'B6', 'B7', 'B12',
    'C2', 'C7', 'C15',
    'D5', 'D6', 'D10',
    'E1', 'E8', 'E14',
    'F8', 'F9', 'F16',
    'G4', 'G13',
    'H2', 'H11', 'H17',
    'I5', 'I6', 'I12',
    'J8', 'J15',
    'K3', 'K9',
    'L1', 'L14'
  ];

  function createCinema() {

    rows.forEach(rowLetter => {

      const row = document.createElement('div');
      row.classList.add('row');

      const label = document.createElement('div');
      label.classList.add('row-label');
      label.textContent = rowLetter;

      const seatsContainer = document.createElement('div');
      seatsContainer.classList.add('seats');

      for (let i = 1; i <= seatsPerRow; i++) {

        if (i === 7 || i === 13) {

          const stairway = document.createElement('div');
          stairway.classList.add('stairway');

          const stairs = document.createElement('div');
          stairs.classList.add('stairs');

          for (let s = 0; s < 5; s++) {

            const step = document.createElement('div');
            step.classList.add('step');
            stairs.appendChild(step);

          }

          const stairText = document.createElement('div');
          stairText.classList.add('stair-text');
          stairText.textContent = 'ESCADA';

          stairway.appendChild(stairs);
          stairway.appendChild(stairText);

          seatsContainer.appendChild(stairway);
        }

        const seat = document.createElement('div');
        const seatNumber = document.createElement('span');
        const seatId = `${rowLetter}${i}`;

        seat.classList.add('seat');
        seat.dataset.seat = seatId;

        seatNumber.classList.add('seat-number');
        seatNumber.textContent = i;

        seat.appendChild(seatNumber);

        if (occupiedSeats.includes(seatId)) {
          seat.classList.add('occupied');
        }

        if (
          (rowLetter === 'K' || rowLetter === 'L') &&
          (i === 1 || i === 2 || i === 17 || i === 18)
        ) {
          seat.classList.add('wheelchair');
          seat.innerHTML = '♿';
        }

        seat.addEventListener('click', () => toggleSeat(seat));

        seatsContainer.appendChild(seat);
      }

      row.appendChild(label);
      row.appendChild(seatsContainer);

      cinema.appendChild(row);
    });
  }

  function toggleSeat(seat) {

    if (seat.classList.contains('occupied')) return;

    seat.classList.toggle('selected');

    updateSelection();
  }

  function updateSelection() {

    const selectedSeats = document.querySelectorAll('.seat.selected');

    const seats = [...selectedSeats].map(
      seat => seat.dataset.seat
    );

    if (seats.length === 0) {

      selectedSeatsText.textContent =
        'Nenhum assento selecionado';

    } else {

      selectedSeatsText.innerHTML =
        `Assentos selecionados: <strong>${seats.join(', ')}</strong>`;
    }

    const total = seats.length * ticketPrice;

    totalText.textContent =
      `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
  }

  window.confirmSelection = function () {

    const selectedSeats =
      document.querySelectorAll('.seat.selected');

    if (selectedSeats.length === 0) {

      alert('Selecione ao menos um assento!');
      return;
    }

    const seats = [...selectedSeats].map(
      seat => seat.dataset.seat
    );

    alert(
      `Compra realizada com sucesso!\n\nAssentos: ${seats.join(', ')}`
    );
  }

  createCinema();

}
</script>

  <div class="movie-panel">
    <img class="movie-poster" src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop" alt="Poster do Filme">

    <div class="movie-title">Interestelar</div>

    <div class="movie-info">
      📅 Sexta-feira<br>
      🕒 21:30<br>
      🎬 Sala Premium 03<br>
      ⏱️ 2h 49min
    </div>

    <div class="selection-box">
      <div class="selection-title">🍿 Seus Assentos</div>

      <div class="selected-list" id="selectedSeatsPanel">
        Nenhum assento selecionado
      </div>

      <div class="total" id="totalPanel">Total: R$ 0,00</div>

      <button class="button" onclick="confirmSelection()" style="width:100%; margin-top:18px;">
        Confirmar Compra
      </button>
    </div>
  </div>
</div>
</body>
</html>
