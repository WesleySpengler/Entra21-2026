<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Detalhes do CEP</title>

  <style>

    body{
      font-family:Arial;
      background:#f2f2f2;
      padding:30px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:10px;
      max-width:500px;
      margin:auto;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    label{
      display:block;
      margin-top:10px;
      font-weight:bold;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:5px;
      box-sizing:border-box;
    }

    button{
      margin-top:20px;
      padding:10px 20px;
      background:#007bff;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>Detalhes do CEP</h1>

    <label>CEP</label>

    <input
      type="text"
      id="cep">

    <label>Rua</label>

    <input
      type="text"
      id="rua">

    <label>Bairro</label>

    <input
      type="text"
      id="bairro">

    <label>Cidade</label>

    <input
      type="text"
      id="cidade">

    <label>Estado</label>

    <input
      type="text"
      id="estado">

    <button onclick="voltar()">

      Voltar

    </button>

  </div>

  <script>

    const params =
    new URLSearchParams(window.location.search)

    const cep =
    params.get('cep')

    document.getElementById('cep').value = cep

    buscarLogradouro()

    function buscarLogradouro(){

      fetch(`https://viacep.com.br/ws/${cep}/json/`)

      .then(dados => dados.json())

      .then(resposta => {

        document.getElementById('rua').value =
        resposta.logradouro

        document.getElementById('bairro').value =
        resposta.bairro

        document.getElementById('cidade').value =
        resposta.localidade

        document.getElementById('estado').value =
        resposta.uf

      })

    }

    function voltar(){

      window.location.href = 'lista.html'

    }

  </script>

</body>
</html>
